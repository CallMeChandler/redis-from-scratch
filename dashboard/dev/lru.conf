# Primary with a tiny memory ceiling for the dashboard's LRU experiment.
# Run from the repository root:  ./build/redis-server dashboard/dev/lru.conf
#
# With max-memory 3000 the dashboard suggests ~1135-byte values:
# A and B fit, writing C exceeds the limit and evicts the LRU key.
bind 127.0.0.1
port 6379

rdb-file lru.rdb
aof-file lru.aof

max-memory 3000

save-on-shutdown no
