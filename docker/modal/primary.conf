# Primary for the public Modal deployment only. Overlaid onto
# /etc/redis-from-scratch/primary.conf by docker/modal/modal_app.py;
# docker/all-in-one/primary.conf (and every local config) stay unlimited.
bind 127.0.0.1
port 6379
rdb-file dump.rdb
aof-file appendonly.aof

# 64 MiB of logical memory (as reported by INFO used_memory), then all-keys
# LRU eviction. Evictions are logged to the AOF as DEL and replicated, so the
# replica (left unlimited) tracks the primary's dataset size.
max-memory 67108864

save-on-shutdown yes
