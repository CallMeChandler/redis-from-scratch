# Replica for docker-compose.yml.
# replicaof must be an IPv4 literal (the server uses inet_pton, not DNS),
# so compose pins the primary to 172.28.0.10.
bind 0.0.0.0
port 6380

rdb-file replica.rdb
aof-file replica.aof

listen-backlog 128
max-clients 1024

max-memory 0

save-on-shutdown yes

replicaof 172.28.0.10 6379
